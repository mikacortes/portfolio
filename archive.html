<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monica Cortes | Archive</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="components.js"></script>
  </head>
  <body class="archive-page">
    <site-header brand-href="/" projects-href="/#featured-projects"></site-header>

    <main class="archive-main">
      <div class="container">
        <section class="archive-intro" aria-labelledby="archive-title">
          <h1 id="archive-title">Take a peek at previous projects!</h1>
        </section>

        <section class="archive-folder-grid" aria-label="Archive folders">
          <button type="button" class="archive-folder" data-folder="social-media" aria-haspopup="dialog">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>Social Media</span>
          </button>

          <button type="button" class="archive-folder" data-folder="graphic-design" aria-haspopup="dialog">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>Graphic Design</span>
          </button>

          <button type="button" class="archive-folder" data-folder="layout-design" aria-haspopup="dialog">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>Layout Design</span>
          </button>

          <button type="button" class="archive-folder" data-folder="ui-ux-design" aria-haspopup="dialog">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>UI/UX Design</span>
          </button>
        </section>
      </div>
    </main>

    <div class="archive-modal" id="archive-modal" hidden>
      <div class="archive-modal-backdrop" data-close-modal aria-hidden="true"></div>
      <div
        class="archive-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="archive-modal-title"
      >
        <button type="button" class="archive-modal-close" aria-label="Close folder">
          <img src="assets/icons/Arrow left.svg" alt="" />
        </button>
        <div class="archive-modal-body">
          <h2 id="archive-modal-title" class="archive-modal-folder-title"></h2>
          <div class="archive-modal-sections" id="archive-modal-sections"></div>
        </div>
      </div>
    </div>

    <site-footer
      brand-href="/"
      projects-href="/#featured-projects"
    ></site-footer>

    <script>
      (function () {
        const modal = document.getElementById('archive-modal');
        const modalTitle = document.getElementById('archive-modal-title');
        const modalSections = document.getElementById('archive-modal-sections');
        const closeButton = modal.querySelector('.archive-modal-close');
        const backdrop = modal.querySelector(".archive-modal-backdrop");
        const folders = document.querySelectorAll(".archive-folder[data-folder]");
        let lastFocusedElement = null;

        const folderContent = {
          "social-media": {
            title: "Social Media",
            sections: [
              {
                title: "Campaign Concepts",
                text: "Early explorations for social-first storytelling, post formats, and visual hooks tailored to each platform.",
              },
              {
                title: "Content Systems",
                text: "Templates and repeatable layouts that keep brand voice consistent while making weekly publishing faster.",
              },
              {
                title: "Published Posts",
                text: "A sample of shipped social posts highlighting typography, color, and layout decisions in context.",
              },
            ],
          },
          "graphic-design": {
            title: "Graphic Design",
            sections: [
              {
                title: "Brand Marks",
                text: "Logo studies, mark refinements, and alternate treatments created during identity exploration.",
              },
              {
                title: "Print & Collateral",
                text: "Posters, flyers, and event materials focused on hierarchy, contrast, and readable information design.",
              },
              {
                title: "Visual Experiments",
                text: "Illustration and composition exercises that informed later product and marketing work.",
              },
            ],
          },
          "layout-design": {
            title: "Layout Design",
            sections: [
              {
                title: "Editorial Spreads",
                text: "Magazine-style layouts balancing photography, pull quotes, and long-form reading rhythm.",
              },
              {
                title: "Grid Studies",
                text: "Modular grids and baseline systems used to align type, imagery, and negative space.",
              },
              {
                title: "Responsive Layouts",
                text: "Breakpoint explorations showing how dense desktop layouts simplify for smaller screens.",
              },
            ],
          },
          "ui-ux-design": {
            title: "UI/UX Design",
            sections: [
              {
                title: "Wireframes",
                text: "Low-fidelity flows mapping core tasks, navigation paths, and content priority before visual design.",
              },
              {
                title: "Interface Screens",
                text: "High-fidelity UI explorations covering components, states, and screen-to-screen continuity.",
              },
              {
                title: "Prototype Moments",
                text: "Key interaction snapshots from usability tests and iteration cycles across product teams.",
              },
            ],
          },
        };

        function buildGallery() {
          const gallery = document.createElement("div");
          gallery.className = "archive-modal-gallery";
          gallery.setAttribute("role", "list");

          for (let index = 0; index < 5; index += 1) {
            const thumb = document.createElement("div");
            thumb.className = "archive-modal-thumb";
            thumb.setAttribute("role", "listitem");
            thumb.setAttribute("aria-label", `Image ${index + 1}`);
            gallery.appendChild(thumb);
          }

          return gallery;
        }

        function renderSections(sections) {
          modalSections.replaceChildren();

          sections.forEach((section) => {
            const block = document.createElement("section");
            block.className = "archive-modal-section";

            const heading = document.createElement("h3");
            heading.textContent = section.title;

            const copy = document.createElement("p");
            copy.textContent = section.text;

            block.append(heading, copy, buildGallery());
            modalSections.appendChild(block);
          });
        }

        function openModal(folderKey) {
          const content = folderContent[folderKey];
          if (!content) {
            return;
          }

          lastFocusedElement = document.activeElement;
          modalTitle.textContent = content.title;
          renderSections(content.sections);
          modal.hidden = false;
          document.body.classList.add("archive-modal-open");
          closeButton.focus();
        }

        function closeModal() {
          modal.hidden = true;
          document.body.classList.remove("archive-modal-open");

          if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
            lastFocusedElement.focus();
          }
        }

        folders.forEach((folder) => {
          folder.addEventListener("click", () => {
            openModal(folder.dataset.folder);
          });
        });

        closeButton.addEventListener("click", closeModal);
        backdrop.addEventListener("click", closeModal);

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !modal.hidden) {
            closeModal();
          }
        });
      })();
    </script>
  </body>
</html>
