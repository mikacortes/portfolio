<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monica Cortes | Archive</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="components.js"></script>
  </head>
  <body class="archive-page">
    <site-header brand-href="/" projects-href="/#featured-projects"></site-header>

    <main class="archive-main">
      <div class="container">
        <section class="archive-intro" aria-labelledby="archive-title">
          <h1 id="archive-title">Archive of past projects</h1>
          <p>Take a peek at previous projects!</p>
        </section>

        <section class="archive-folder-grid" aria-label="Archive folders">
          <div class="archive-folder">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>Social Media</span>
          </div>

          <div class="archive-folder">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>Graphic Design</span>
          </div>

          <div class="archive-folder">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>Layout Design</span>
          </div>

          <div class="archive-folder">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>UI/UX Design</span>
          </div>
        </section>
      </div>
    </main>

    <site-footer
      brand-href="/"
      projects-href="/#featured-projects"
    ></site-footer>
  </body>
</html>
