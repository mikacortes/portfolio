    <site-header brand-href="/" projects-href="/#featured-projects"></site-header>

    <main class="archive-main">
      <div class="container">
        <section class="archive-intro" aria-labelledby="archive-title">
          <h1 id="archive-title">Take a peek at previous projects!</h1>
        </section>

        <section class="archive-folder-grid" aria-label="Archive folders">
          <button type="button" class="archive-folder" data-folder="social-media" aria-haspopup="dialog" aria-controls="archive-modal">

          <button type="button" class="archive-folder" data-folder="layout-design" aria-haspopup="dialog" aria-controls="archive-modal">

            <span>Layout Design</span>
          </button>

          <button type="button" class="archive-folder" data-folder="ui-ux-design" aria-haspopup="dialog" aria-controls="archive-modal">
            <img src="assets/icons/Folder Icon.svg" alt="" aria-hidden="true" />
            <span>UI/UX Design</span>
          </button>
        </section>
      </div>
    </main>

    <div class="archive-modal" id="archive-modal" aria-hidden="true" hidden>
      <div class="archive-modal-backdrop" data-close-modal aria-hidden="true"></div>
      <div
        class="archive-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="archive-modal-title"
      >
        <div class="archive-modal-body">
          <button type="button" class="archive-modal-close" aria-label="Close folder">
            <img src="assets/icons/Arrow left.svg" alt="" />
          </button>
          <h2 id="archive-modal-title" class="archive-modal-folder-title"></h2>
          <div class="archive-modal-sections" id="archive-modal-sections"></div>
        </div>
      </div>
    </div>

    <site-footer
      brand-href="/"
      projects-href="/#featured-projects"

    <script>
      (function () {

        const archiveImageMinHeight = 300;

          wide: { maxWidth: 520, maxHeight: 420 },
          tall: { maxWidth: 320, maxHeight: 480 },
          standard: { maxWidth: 360, maxHeight: 360 },

        function scaleArchiveImage(img, layout) {
          const naturalWidth = img.naturalWidth;
          const naturalHeight = img.naturalHeight;
          if (!naturalWidth || !naturalHeight) {
            return;
          }

          const limits = archiveImageLayoutLimits[layout] || archiveImageLayoutLimits.standard;
          let width = naturalWidth;
          let height = naturalHeight;

          if (height < archiveImageMinHeight) {
            const scaleUp = archiveImageMinHeight / height;
            width *= scaleUp;
            height = archiveImageMinHeight;
          }

          const widthRatio = limits.maxWidth / width;
          const heightRatio = limits.maxHeight / height;
          const shrinkRatio = Math.min(1, widthRatio, heightRatio);
          width *= shrinkRatio;
          height *= shrinkRatio;

          if (height < archiveImageMinHeight) {
            const scaleUp = archiveImageMinHeight / height;
            width *= scaleUp;
            height = archiveImageMinHeight;
          }

          img.style.width = `${Math.round(width)}px`;
          img.style.height = `${Math.round(height)}px`;
        }

        const folderContent = {

            sections: [

                images: [
                  { file: "ui-ux-design/helping-hands/helping hands 1.png", layout: "tall" },
                  { file: "ui-ux-design/helping-hands/helping hands 2.png", layout: "tall" },
                  { file: "ui-ux-design/helping-hands/helping hands 3.png", layout: "tall" },
                  { file: "ui-ux-design/helping-hands/helping hands 4.png", layout: "tall" },
                  { file: "ui-ux-design/helping-hands/helping hands 5.png", layout: "tall" },
                ],
              },
              {
                title: "SF Parks & Rec",
                text: "Redesigned SF Rec & Park's picnic reservation flow for Berkeley's INFO 215 Product Design Studio—replacing a text-heavy, table-based experience with filters and card-based discovery, clearer pricing and availability, and a streamlined path from explore to book (14+ mobile screens). Product Designer · 1 month · Figma.",
                caseStudyHref: "/",
                images: [],
              },
            ],
          },
        };

        function createGalleryThumb(index, isClone, label) {
          const thumb = document.createElement("div");
          thumb.className = "archive-modal-thumb";
          thumb.setAttribute("role", "listitem");
          thumb.setAttribute("aria-label", label || `Image ${index + 1}`);
          if (isClone) {
            thumb.setAttribute("aria-hidden", "true");
            thumb.dataset.clone = "true";
          }
          return thumb;
        }

        function normalizeGalleryImage(image, defaultLayout) {
          if (typeof image === "string") {
            return { file: image, layout: defaultLayout || "standard" };
          }

          return {
            file: image.file,
            layout: image.layout || defaultLayout || "standard",
          };
        }

        function appendGalleryImage(gallery, image, index, isClone) {
          const { file, layout } = image;
          const label = file.replace(/\.[^.]+$/, "");
          const thumb = createGalleryThumb(index, isClone, label);
          thumb.classList.add(`archive-modal-thumb--${layout}`);
          const img = document.createElement("img");
          img.src = `${archiveImageBase}${file}`;
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";

          const applyScale = () => {
            scaleArchiveImage(img, layout);
            gallery.dispatchEvent(new Event("archive-gallery-resize"));
          };

          img.addEventListener("load", applyScale);
          if (img.complete) {
            applyScale();
          }

          thumb.appendChild(img);
          gallery.appendChild(thumb);
        }

        function buildGallery(images, defaultLayout) {
          if (!images || images.length === 0) {
            return null;
          }

          const normalizedImages = images.map((image) =>
            normalizeGalleryImage(image, defaultLayout)
          );

          const wrap = document.createElement("div");
          wrap.className = "archive-modal-gallery-wrap";

          const gallery = document.createElement("div");
          gallery.className = "archive-modal-gallery";
          gallery.setAttribute("role", "list");

          normalizedImages.forEach((image, index) => {
            appendGalleryImage(gallery, image, index, false);
          });

          normalizedImages.forEach((image, index) => {
            appendGalleryImage(gallery, image, index, true);
          });

          wrap.appendChild(gallery);
          return wrap;
        }

        function initGalleryInfiniteScroll(gallery) {
          const updateLoopWidth = () => {
            const loopWidth = gallery.scrollWidth / 2;
            if (loopWidth > 0) {
              gallery.dataset.loopWidth = String(loopWidth);
            }
            return loopWidth;
          };

          const normalizeScroll = () => {
            const loopWidth = Number(gallery.dataset.loopWidth) || updateLoopWidth();
            if (!loopWidth) {
              return;
            }

            while (gallery.scrollLeft >= loopWidth) {
              gallery.scrollLeft -= loopWidth;
            }
          };

          gallery.addEventListener("scroll", normalizeScroll, { passive: true });

          const blockUserScroll = (event) => {
            event.preventDefault();
          };

          gallery.addEventListener("wheel", blockUserScroll, { passive: false });
          gallery.addEventListener("touchmove", blockUserScroll, { passive: false });

          const resizeObserver = new ResizeObserver(updateLoopWidth);
          resizeObserver.observe(gallery);
          gallery.addEventListener("archive-gallery-resize", updateLoopWidth);
          requestAnimationFrame(updateLoopWidth);

          return () => {
            resizeObserver.disconnect();
            gallery.removeEventListener("archive-gallery-resize", updateLoopWidth);
            gallery.removeEventListener("scroll", normalizeScroll);
            gallery.removeEventListener("wheel", blockUserScroll);
            gallery.removeEventListener("touchmove", blockUserScroll);
          };
        }

        function stopAllGalleryAutoScroll() {
          galleryScrollStops.forEach((stop) => stop());
          galleryScrollStops = [];
        }

        function startGalleryAutoScroll(gallery, galleryWrap) {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            return () => {};
          }

          const scrollSpeedNormal = 0.9;
          const scrollSpeedHover = 0.45;
          let scrollSpeed = scrollSpeedNormal;
          let running = true;
          let rafId = null;

          const step = () => {
            if (!running) {
              return;
            }

            const loopWidth = Number(gallery.dataset.loopWidth);
            if (loopWidth > 0) {
              gallery.scrollLeft += scrollSpeed;
              if (gallery.scrollLeft >= loopWidth) {
                gallery.scrollLeft -= loopWidth;
              }
            }

            rafId = requestAnimationFrame(step);
          };

          galleryWrap.addEventListener("mouseenter", () => {
            scrollSpeed = scrollSpeedHover;
          });
          galleryWrap.addEventListener("mouseleave", () => {
            scrollSpeed = scrollSpeedNormal;
          });

          rafId = requestAnimationFrame(step);

          return () => {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
            }
          };
        }

        function createCaseStudyLink(section) {
          if (!section.caseStudyHref) {
            return null;
          }

          const link = document.createElement("a");
          link.className = "tertiary-button archive-modal-case-study";
          link.href = section.caseStudyHref;

          const label = document.createElement("span");
          label.textContent = "See case study";

          const arrow = document.createElement("span");
          arrow.className = "tertiary-button__arrow";
          arrow.setAttribute("aria-hidden", "true");

          const arrowIcon = document.createElement("img");
          arrowIcon.src = "assets/icons/Arrow right.svg";
          arrowIcon.alt = "";
          arrow.appendChild(arrowIcon);
          link.append(label, arrow);

          return link;
        }

        function renderSections(sections) {
          stopAllGalleryAutoScroll();
          modalSections.replaceChildren();

          sections.forEach((section) => {
            const block = document.createElement("section");
            block.className = "archive-modal-section";

            const heading = document.createElement("h3");
            heading.textContent = section.title;

            const copy = document.createElement("p");
            copy.textContent = section.text;

            const caseStudyLink = createCaseStudyLink(section);
            const galleryWrap = buildGallery(section.images, section.galleryLayout);
            block.append(heading, copy);
            if (caseStudyLink) {
              block.append(caseStudyLink);
            }
            if (galleryWrap) {
              const gallery = galleryWrap.querySelector(".archive-modal-gallery");
              block.append(galleryWrap);
              galleryScrollStops.push(initGalleryInfiniteScroll(gallery));
              galleryScrollStops.push(startGalleryAutoScroll(gallery, galleryWrap));
            }
            modalSections.appendChild(block);
          });
        }

        function openModal(folderKey) {
          const content = folderContent[folderKey];
          if (!content) {
            return;
          }

          lastFocusedElement = document.activeElement;
          modalTitle.textContent = content.title;
          renderSections(content.sections);
          modal.hidden = false;
          modal.classList.add("is-open");
          modal.setAttribute("aria-hidden", "false");
          document.body.classList.add("archive-modal-open");
          closeButton.focus();
        }

        function closeModal() {
          stopAllGalleryAutoScroll();
          modal.classList.remove("is-open");
          modal.setAttribute("aria-hidden", "true");
          modal.hidden = true;
          document.body.classList.remove("archive-modal-open");

          if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
            lastFocusedElement.focus();
          }
        }

        folders.forEach((folder) => {
          folder.addEventListener("click", () => {
            openModal(folder.dataset.folder);
          });
        });

        closeButton.addEventListener("click", closeModal);
        backdrop.addEventListener("click", closeModal);

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !modal.hidden) {
            closeModal();
          }
        });
      })();
    </script>
  </body>
